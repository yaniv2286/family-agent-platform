version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - family-agents-net

  koko-backend:
    build: .
    container_name: koko-backend
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/data/family_platform.db
      - TUTOR_HISTORY_DATABASE_URL=sqlite+aiosqlite:///app/data/tutor_history.db
      - TZ=Asia/Jerusalem
      - APP_TIMEZONE=Asia/Jerusalem
      - AGENT_NEURALTRADER_URL=http://neuraltrader-control:8000
      - AGENT_VOLATILITYHUNTER_URL=http://volatilityhunter_monitoring:8080
    env_file:
      - .env
    volumes:
      - ./data/koko:/app/data
    networks:
      - family-agents-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5); exit(0) if r.status == 200 else exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  family-agents-net:
    name: family-agents-net
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
